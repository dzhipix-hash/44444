name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r telegram_parser/requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller TelegramParser.spec

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: TelegramParser-Windows
          path: dist/TelegramParser.exe
